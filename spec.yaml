id: gcf_event_download
requirements:
  - name: ecoscope-platform
    version: ">=2.16.0, <2.17.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc14"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: ecoscope-workflows-ext-gcf
    version: "0.1.0"
    channel: https://repo.prefix.dev/ecoscope-workflows-gcf/

rjsf-overrides:
  properties:
    get_event_data.properties.event_types.description: >-
      Specify the event type(s) to download (optional). Enter the VALUE (not
      display name) for each event type (e.g. "giraffe_survey_encounter_nam").
      Values can be found in EarthRanger Admin under Activity > Event Types.
      Leave empty to include all event types.
    get_event_data.properties.event_types.title: "Event Types"
    get_event_data.properties.force_point_geometry.title: "Reduce Polygon Events to Points"
    get_event_data.properties.force_point_geometry.default: false
    get_event_data.properties.force_point_geometry.ecoscope:advanced: false

    Generate Maps.properties.skip_map_generation.properties.skip.default: true
    Download Attachments.properties.skip_attachment_download.properties.skip.default: true

    persist_events.properties.filename_prefix.default: "events"
    persist_events.properties.filetypes.default: ["csv"]
    persist_events.properties.filetypes.items.enum: ["csv", "parquet"]
    persist_events.properties.filetypes.description: >-
      Output file format. CSV opens in Excel. Parquet preserves geometry and
      is recommended for spatial analysis.

    Process Events.properties.process_columns.properties.drop_columns.default:
      - level_8
      - index
      - location
      - reported_by
      - event_details
      - geojson
      - attributes
      - notes
      - patrols
      - patrol_segments
      - is_contained_in
      - related_subjects
      - location_lat
      - location_lon
      - message
      - provenance
      - event_category
      - priority_label
      - comment
      - end_time
      - sort_at
      - icon_id
      - url
      - image_url
      - external_source
    Process Events.properties.process_columns.properties.drop_columns.description: >-
      Columns to remove from the export. Defaults match the GCF Twiga Tools
      Event Download page. Adjust as needed.

  uiSchema:
    Download Attachments.download_attachments.ui:options.label: false
    Download Attachments.download_attachments.attachments_subdir.items.ui:options.label: false
    Process Events.filter_events.filter_point_coords.items.ui:options.label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:

  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Get Event Data
    id: get_event_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns: null
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true

  - title: Process Events
    type: task-group
    description: >-
      Flatten and clean event data: timezone conversion, event detail
      normalisation, column filtering, and optional SQL transformation.
    tasks:

      - name: Convert to timezone
        id: convert_to_user_timezone
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.get_event_data.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns: ["time"]
          auto_detect: false

      - name: Extract reported_by_name from Events
        id: extract_reported_by
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.convert_to_user_timezone.return }}
          column_name: "reported_by"
          field_name_options: ["name"]
          output_type: "str"
          output_column_name: "reported_by_name"

      - name: Extract reported_by_subtype from Events
        id: extract_reported_by_subtype
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_reported_by.return }}
          column_name: "reported_by"
          field_name_options: ["subject_subtype"]
          output_type: "str"
          output_column_name: "reported_by_subtype"

      - name: Process Event Details
        id: process_event_details
        task: process_events_details
        partial:
          df: ${{ workflow.extract_reported_by_subtype.return }}
          client: ${{ workflow.er_client_name.return }}
          map_to_titles: true
          ordered: true

      - name: Normalize Event Details
        id: normalize_event_details
        task: normalize_json_column
        partial:
          df: ${{ workflow.process_event_details.return }}
          column: "event_details"
          skip_if_not_exists: true
          sort_columns: false

      - name: Remove Column Prefix Event Details
        id: drop_event_details_prefix
        task: drop_column_prefix
        partial:
          df: ${{ workflow.normalize_event_details.return }}
          prefix: "event_details__"
          duplicate_strategy: "suffix"

      - name: Convert event detail datetimes to timezone
        id: convert_event_details_timezone
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.drop_event_details_prefix.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns: []
          auto_detect: true

      - name: Flatten GCF Repeat Groups
        id: flatten_repeat_groups
        task: flatten_gcf_repeat_groups
        partial:
          df: ${{ workflow.convert_event_details_timezone.return }}

      - name: Events Colormap
        id: events_colormap
        task: apply_color_map
        partial:
          input_column_name: "event_type"
          colormap: "tab20b"
          output_column_name: "event_type_colormap"
          df: ${{ workflow.flatten_repeat_groups.return }}

      - name: Filter Event Relocations
        id: filter_events
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.events_colormap.return }}
          roi_gdf: null
          roi_name: null
          reset_index: true

      - name: Preprocess Columns
        id: process_columns
        task: map_columns
        partial:
          df: ${{ workflow.filter_events.return }}
          rename_columns:
            time: event_time
            id: event_id
          retain_columns: []
          raise_if_not_found: false

      - name: Apply SQL Query
        id: sql_query
        task: apply_sql_query
        partial:
          df: ${{ workflow.process_columns.return }}

      - name: Group Data
        id: groupers
        task: set_groupers

      - name: Add temporal index to Events
        id: events_add_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.sql_query.return }}
          time_col: "event_time"
          groupers: ${{ workflow.groupers.return }}
          cast_to_datetime: true
          format: "mixed"

      - name: Split Events by Group
        id: split_event_groups
        task: split_groups
        partial:
          df: ${{ workflow.events_add_temporal_index.return }}
          groupers: ${{ workflow.groupers.return }}

  - name: Persist Events
    id: persist_events
    task: persist_df_wrapper
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_event_groups.return }}
    skipif:
      conditions:
        - never

  - title: Download Attachments
    type: task-group
    description: Download attachments associated with the events.
    tasks:
      - name: Skip Attachment Download
        id: skip_attachment_download
        task: maybe_skip_df
        partial:
          df: ${{ workflow.get_event_data.return }}

      - name: Download Attachments
        id: download_attachments
        task: download_event_attachments
        partial:
          client: ${{ workflow.er_client_name.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          use_index_as_id: false
          event_gdf: ${{ workflow.skip_attachment_download.return }}
          skip_download: false
          attachments_subdir: "attachments"

  - title: Generate Maps
    type: task-group
    description: Generate maps to visualise events. Skipped by default.
    tasks:

      - name: Skip Map Generation
        id: skip_map_generation
        task: maybe_skip_df
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_event_groups.return }}

      - name: Drop duplicate columns
        id: dedup_columns
        task: drop_duplicate_columns
        partial:
          strategy: "drop_last"
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.skip_map_generation.return }}

      - name: Rename columns for map tooltip display
        id: rename_display_columns
        task: map_columns
        partial:
          drop_columns: []
          retain_columns: []
          rename_columns:
            serial_number: "Event Serial"
            event_time: "Event Time"
            event_type_display: "Event Type"
            reported_by_name: "Reported By"
          raise_if_not_found: false
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.dedup_columns.return }}

      - name: Filter Points for Map Layer
        id: filter_points_for_map
        task: filter_by_geometry_type
        partial:
          geometry_types: ["Point"]
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.rename_display_columns.return }}

      - name: Filter Polygons for Map Layer
        id: filter_polygons_for_map
        task: filter_by_geometry_type
        partial:
          geometry_types: ["Polygon", "MultiPolygon"]
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.rename_display_columns.return }}

      - name: Set Events Map Title
        id: set_events_map_title
        task: set_string_var
        partial:
          var: "Events Map"

      - name: " "
        id: base_map_defs
        task: set_base_maps

      - name: Create map layer from grouped Events
        id: grouped_events_map_layer
        task: create_point_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            fill_color_column: "event_type_colormap"
            get_radius: 5
          legend:
            label_column: "Event Type"
            color_column: "event_type_colormap"
          tooltip_columns: ["Event Serial", "Event Time", "Event Type", "Reported By"]
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.filter_points_for_map.return }}

      - name: Create polygon layer from grouped Events
        id: grouped_events_polygon_layer
        task: create_polygon_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            fill_color_column: "event_type_colormap"
            stroked: true
            get_line_color: "white"
            get_line_width: 2
            opacity: 0.4
          legend:
            label_column: "Event Type"
            color_column: "event_type_colormap"
          tooltip_columns: ["Event Serial", "Event Time", "Event Type", "Reported By"]
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.filter_polygons_for_map.return }}

      - name: Combine Point and Polygon layers per group
        id: combined_event_map_layers
        task: groupbykey
        skipif:
          conditions:
            - all_keyed_iterables_are_skips
          unpack_depth: 1
        partial:
          iterables:
            - ${{ workflow.grouped_events_polygon_layer.return }}
            - ${{ workflow.grouped_events_map_layer.return }}

      - name: Draw Ecomap from grouped Events
        id: grouped_events_ecomap
        task: draw_ecomap
        partial:
          title: null
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Event Type"
            format_title: false
            placement: "bottom-right"
          static: false
          max_zoom: 20
          widget_id: ${{ workflow.set_events_map_title.return }}
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.combined_event_map_layers.return }}

      - name: Persist grouped Events Ecomap as Text
        id: grouped_events_ecomap_html_url
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.grouped_events_ecomap.return }}

      - name: Create grouped Events Map Widget
        id: grouped_events_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_events_map_title.return }}
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.grouped_events_ecomap_html_url.return }}

      - name: Merge Events Map Widget Views
        id: grouped_events_map_widget_merge
        task: merge_widget_views
        partial:
          widgets: ${{ workflow.grouped_events_map_widget.return }}

  - name: Create Dashboard
    id: events_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.grouped_events_map_widget_merge.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
